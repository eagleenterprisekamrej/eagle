// ── Firebase helpers ──────────────────────────────────────────
const fbGet = (path) => db.ref(path).get().then(s => s.val());
const fbSet = (path, val) => db.ref(path).set(val);
const fbUpdate = (path, val) => db.ref(path).update(val);
const fbPush = (path, val) => db.ref(path).push(val);
const fbDelete = (path) => db.ref(path).remove();
const fbOn = (path, cb) => { db.ref(path).on('value', s => cb(s.val())); return () => db.ref(path).off(); };
const fbOnce = (path) => db.ref(path).once('value').then(s => s.val());

const nowIST = () => {
  const d = new Date();
  const ist = new Date(d.getTime() + (5.5 * 60 * 60 * 1000));
  return ist.toISOString().replace('Z','') + '+05:30';
};
const todayStr = () => {
  const d = new Date();
  const ist = new Date(d.getTime() + (5.5 * 60 * 60 * 1000));
  return ist.toISOString().slice(0,10);
};
const daysInMonth = (y,m) => new Date(y,m,0).getDate();
const shiftMonth = (ym,n) => { const [y,m]=ym.split('-').map(Number); const d=new Date(y,m-1+n,1); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`; };
const fmtFull = (ds) => { const [y,m,d]=ds.split('-').map(Number); return new Date(y,m-1,d).toLocaleDateString('en-IN',{weekday:'long',day:'numeric',month:'long',year:'numeric'}); };
const fmtMonthLabel = (ym) => { const [y,m]=ym.split('-').map(Number); return new Date(y,m-1,1).toLocaleDateString('en-IN',{month:'long',year:'numeric'}); };
const fmtTs = (ts) => { try { const d=new Date(ts); return d.toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'2-digit'})+' '+d.toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit',hour12:true}); } catch { return ts||''; } };

// ═══════════════════════════════════════════════════════════════
// DEPT MANAGER COMPONENT
// ═══════════════════════════════════════════════════════════════
const PRESET_COLORS = ['#3b82f6','#10b981','#f59e0b','#ef4444','#8b5cf6','#ec4899','#06b6d4','#84cc16','#f97316','#64748b'];

function DeptManager({depts, saveDepts, showFlash}) {
  const [editId,setEditId] = useState(null);
  const [editName,setEditName] = useState('');
  const [editColor,setEditColor] = useState('');
  const [newName,setNewName] = useState('');
  const [newColor,setNewColor] = useState(PRESET_COLORS[0]);
  const inp2 = {border:'1px solid #e2e8f0',borderRadius:8,padding:'5px 10px',fontSize:13,outline:'none',fontFamily:'inherit'};
  return React.createElement('div',{style:{...card,padding:'16px 20px'}},
    React.createElement('div',{style:{fontWeight:900,color:NAVY,fontSize:14,marginBottom:14}},'🏢 Department Management'),
    React.createElement('div',{style:{display:'flex',flexDirection:'column',gap:8,marginBottom:14}},
      depts.map(d => editId===d.id ?
        React.createElement('div',{key:d.id,style:{display:'flex',gap:8,alignItems:'center',flexWrap:'wrap',background:'#fffbf8',padding:'8px 12px',borderRadius:8,border:'1px solid #fed7aa'}},
          React.createElement('input',{value:editName,onChange:ev=>setEditName(ev.target.value),style:{...inp2,width:130,borderColor:'#f97316'}}),
          React.createElement('div',{style:{display:'flex',gap:4,flexWrap:'wrap'}},
            PRESET_COLORS.map(c=>React.createElement('div',{key:c,onClick:()=>setEditColor(c),style:{width:20,height:20,borderRadius:'50%',background:c,cursor:'pointer',border:editColor===c?'3px solid #1c3557':'2px solid transparent'}}))
          ),
          React.createElement('button',{onClick:()=>{if(!editName.trim()){showFlash('⚠️ Name khali na rakho');return;}saveDepts(depts.map(x=>x.id===d.id?{...x,name:editName.trim(),color:editColor}:x));setEditId(null);showFlash('✓ Department updated')},style:{background:'#10b981',color:'#fff',border:'none',borderRadius:7,padding:'5px 14px',cursor:'pointer',fontWeight:700,fontFamily:'inherit'}},'✓ Save'),
          React.createElement('button',{onClick:()=>setEditId(null),style:{background:'#e5e7eb',color:'#374151',border:'none',borderRadius:7,padding:'5px 12px',cursor:'pointer',fontFamily:'inherit'}},'✕')
        )
      :
        React.createElement('div',{key:d.id,style:{display:'flex',alignItems:'center',gap:10,padding:'8px 12px',borderRadius:8,background:'#f8fafc',border:`1px solid ${d.color}30`}},
          React.createElement('div',{style:{width:12,height:12,borderRadius:'50%',background:d.color,flexShrink:0}}),
          React.createElement('span',{style:{fontWeight:800,color:d.color,flex:1,fontSize:14}},d.name),
          React.createElement('button',{onClick:()=>{setEditId(d.id);setEditName(d.name);setEditColor(d.color)},style:{background:'#dbeafe',color:'#1d4ed8',border:'none',borderRadius:6,padding:'3px 12px',cursor:'pointer',fontSize:12,fontWeight:700,fontFamily:'inherit'}},'Edit'),
          React.createElement('button',{onClick:()=>{if(window.confirm(`Delete "${d.name}" department?`))saveDepts(depts.filter(x=>x.id!==d.id))},style:{background:'#fee2e2',color:'#dc2626',border:'none',borderRadius:6,padding:'3px 12px',cursor:'pointer',fontSize:12,fontWeight:700,fontFamily:'inherit'}},'Delete')
        )
      )
    ),
    React.createElement('div',{style:{borderTop:'1px solid #e2e8f0',paddingTop:14}},
      React.createElement('div',{style:{fontSize:12,color:'#94a3b8',fontWeight:700,marginBottom:8}},'+ Add Department'),
      React.createElement('div',{style:{display:'flex',gap:8,alignItems:'center',flexWrap:'wrap'}},
        React.createElement('input',{value:newName,onChange:ev=>setNewName(ev.target.value),placeholder:'Department name',style:{...inp2,width:150}}),
        React.createElement('div',{style:{display:'flex',gap:4,flexWrap:'wrap'}},
          PRESET_COLORS.map(c=>React.createElement('div',{key:c,onClick:()=>setNewColor(c),style:{width:22,height:22,borderRadius:'50%',background:c,cursor:'pointer',border:newColor===c?'3px solid #1c3557':'2px solid transparent'}}))
        ),
        React.createElement('button',{onClick:()=>{
          if(!newName.trim()){showFlash('⚠️ Name lakho');return;}
          if(depts.some(d=>d.name.toLowerCase()===newName.trim().toLowerCase())){showFlash('⚠️ Department already exists');return;}
          saveDepts([...depts,{id:'d'+Date.now(),name:newName.trim(),color:newColor}]);
          setNewName('');showFlash('✓ Department added');
        },style:{background:ORANGE,color:'#fff',border:'none',borderRadius:8,padding:'7px 20px',cursor:'pointer',fontWeight:800,fontFamily:'inherit'}},'Add')
      )
    )
  );
}

// ═══════════════════════════════════════════════════════════════
// MAIN APP
// ═══════════════════════════════════════════════════════════════
function App() {
  // ── Firebase connection status ──────────────────────────────
  const [fbStatus, setFbStatus] = useState('connecting'); // connecting | connected | error

  // ── Auth ────────────────────────────────────────────────────
  const [authed, setAuthed] = useState(() => sessionStorage.getItem(SESSION_KEY)==='1');
  const [pinInput, setPinInput] = useState('');
  const [pinErr, setPinErr] = useState(false);

  // ── Settings ────────────────────────────────────────────────
  const [showSettings, setShowSettings] = useState(false);
  const [settingsPinPrompt, setSettingsPinPrompt] = useState(false);
  const [settingsPinInput, setSettingsPinInput] = useState('');
  const [settingsPinErr, setSettingsPinErr] = useState(false);
  const [settings, setSettings] = useState(DEF_SETTINGS);
  const [newPin1, setNewPin1] = useState('');
  const [newPin2, setNewPin2] = useState('');
  const [pinChangeMsg, setPinChangeMsg] = useState('');
  const [newSpin1, setNewSpin1] = useState('');
  const [newSpin2, setNewSpin2] = useState('');
  const [spinChangeMsg, setSpinChangeMsg] = useState('');
  const [deviceInput, setDeviceInput] = useState(_deviceName);
  const [backupUrlInput, setBackupUrlInput] = useState('');

  // ── App State ────────────────────────────────────────────────
  const [tab, setTab] = useState('att');
  const [emps, setEmps] = useState([]);
  const [att, setAtt] = useState({});
  const [ob, setOb] = useState({});
  const [salHist, setSalHist] = useState({});
  const [depts, setDepts] = useState(DEF_DEPTS);
  const [date, setDate] = useState(todayStr());
  const [ready, setReady] = useState(false);
  const [flash, setFlash] = useState('');
  const [fbConnected, setFbConnected] = useState(false);

  // ── Staff screen ─────────────────────────────────────────────
  const [editId, setEditId] = useState(null);
  const [editRow, setEditRow] = useState({});
  const [newRow, setNewRow] = useState({name:'',salary:'',lp:'',ep:'',mobile:'',deptId:''});
  const [staffSearch, setStaffSearch] = useState('');
  const [showSalary, setShowSalary] = useState(false);
  const [salaryPinPrompt, setSalaryPinPrompt] = useState(false);
  const [salaryPinInput, setSalaryPinInput] = useState('');
  const [salaryPinErr, setSalaryPinErr] = useState(false);

  // ── Attendance search ────────────────────────────────────────
  const [attSearch, setAttSearch] = useState('');
  const [deptFilter, setDeptFilter] = useState('');

  // ── Summary ──────────────────────────────────────────────────
  const [sumYM, setSumYM] = useState(todayStr().slice(0,7));
  const [calView, setCalView] = useState(false);

  // ── Salary slip ──────────────────────────────────────────────
  const [salEmp, setSalEmp] = useState('');
  const [salYM, setSalYM] = useState(todayStr().slice(0,7));
  const [salPanel, setSalPanel] = useState(1);

  // ── History ──────────────────────────────────────────────────
  const [histEmp, setHistEmp] = useState(null);
  const [histYM, setHistYM] = useState(null);

  // ── Staff drag-reorder ────────────────────────────────────────
  const [dragIdx, setDragIdx] = useState(null);
  const [dragOverIdx, setDragOverIdx] = useState(null);

  // ── Audit log ────────────────────────────────────────────────
  const [auditLog, setAuditLog] = useState([]);
  const [logFilter, setLogFilter] = useState({type:'',empId:'',ym:''});

  // ── Old balance auto-post tracking ──────────────────────────
  const [lastRolloverCheck, setLastRolloverCheck] = useState('');

  const showFlash = (msg) => { setFlash(msg); setTimeout(()=>setFlash(''),2000); };

  // ═══════════════════════════════════════════════════════════
  // FIREBASE REALTIME LISTENERS
  // ═══════════════════════════════════════════════════════════
  useEffect(() => {
    // Connection check
    db.ref('.info/connected').on('value', snap => {
      setFbConnected(snap.val() === true);
      setFbStatus(snap.val() ? 'connected' : 'connecting');
    });

    // Load settings first (need PINs before showing auth)
    db.ref('settings').once('value').then(snap => {
      const s = snap.val();
      if (!s) {
        // First time — seed defaults
        db.ref('settings').set(DEF_SETTINGS);
        setSettings(DEF_SETTINGS);
      } else {
        setSettings(s);
        setBackupUrlInput(s.backupSheetUrl||'');
      }
    }).catch(() => setFbStatus('error'));

    // Real-time listeners
    const offStaff = fbOn('staff', val => {
      if (val) {
        const list = Object.entries(val).map(([id, d]) => ({id, ...d}))
          .sort((a,b) => (a.sortOrder??999) - (b.sortOrder??999) || a.name.localeCompare(b.name));
        setEmps(list);
      } else {
        // First boot — seed staff
        const staffObj = {};
        DEF_EMPS.forEach(e => { staffObj[e.id] = e; });
        db.ref('staff').set(staffObj);
        setEmps(DEF_EMPS);
      }
    });

    const offAtt = fbOn('attendance', val => {
      setAtt(val || {});
    });

    const offOb = fbOn('oldBalance', val => {
      setOb(val || {});
    });

    const offSH = fbOn('salaryHistory', val => {
      setSalHist(val || {});
    });

    const offDepts = fbOn('departments', val => {
      if (val) {
        const list = Object.entries(val).map(([id,d]) => ({id, ...d}));
        setDepts(list);
      } else {
        const deptsObj = {};
        DEF_DEPTS.forEach(d => { deptsObj[d.id] = d; });
        db.ref('departments').set(deptsObj);
        setDepts(DEF_DEPTS);
      }
    });

    // Audit log — last 500 entries
    db.ref('auditLog').orderByChild('ts').limitToLast(500).on('value', snap => {
      if (snap.val()) {
        const entries = Object.entries(snap.val())
          .map(([k,v]) => ({_key:k,...v}))
          .sort((a,b) => (b.ts||'').localeCompare(a.ts||''));
        setAuditLog(entries);
      }
    });

    setReady(true);

    return () => { offStaff(); offAtt(); offOb(); offSH(); offDepts(); };
  }, []);

  // ── Month rollover check ─────────────────────────────────────
  useEffect(() => {
    if (!ready || !authed) return;
    const today = todayStr();
    fbGet('settings/lastRolloverCheck').then(last => {
      if (last && last.slice(0,7) !== today.slice(0,7)) {
        const prevYM = shiftMonth(today.slice(0,7), -1);
        autoPostOldBalances(prevYM);
      }
      fbSet('settings/lastRolloverCheck', today);
      setLastRolloverCheck(today);
    });
  }, [ready, authed]);

  // ═══════════════════════════════════════════════════════════
  // AUDIT LOG
  // ═══════════════════════════════════════════════════════════
  const logAudit = useCallback((entries) => {
    const ts = nowIST();
    entries.forEach(e => {
      fbPush('auditLog', {
        ts,
        empId: e.empId||'',
        empName: e.empName||'',
        action: e.type||e.action||'',
        oldVal: e.oldVal??e.detail??'',
        newVal: e.newVal??'',
        device: _deviceName,
        ym: e.ym||todayStr().slice(0,7),
        date: e.date||'',
        detail: e.detail||''
      });
    });
  }, []);

  // ═══════════════════════════════════════════════════════════
  // STAFF OPERATIONS
  // ═══════════════════════════════════════════════════════════
  const saveEmp = (emp, logEntries) => {
    db.ref(`staff/${emp.id}`).set(emp);
    if (logEntries?.length) logAudit(logEntries);
    showFlash('✓ Staff updated');
  };

  const saveEmps = (list, logEntries) => {
    const updates = {};
    list.forEach(e => { updates[`staff/${e.id}`] = e; });
    // Remove deleted
    emps.forEach(e => { if (!list.find(x=>x.id===e.id)) updates[`staff/${e.id}`] = null; });
    db.ref().update(updates);
    if (logEntries?.length) logAudit(logEntries);
    showFlash('✓ Staff updated');
  };

  const saveEmpOrder = (orderedList) => {
    const updates = {};
    orderedList.forEach((e, idx) => {
      updates[`staff/${e.id}/sortOrder`] = idx;
    });
    db.ref().update(updates);
    showFlash('\u2713 Order saved');
  };

  const saveDepts = (list) => {
    const obj = {};
    list.forEach(d => { obj[d.id] = d; });
    // Handle deletes
    depts.forEach(d => { if (!list.find(x=>x.id===d.id)) obj[d.id] = null; });
    db.ref().update(Object.fromEntries(Object.entries(obj).map(([k,v])=>[`departments/${k}`,v])));
    showFlash('✓ Departments updated');

  const getEmpData = (eid, ym) => {
    const emp = emps.find(e=>e.id===eid);
    if (!emp) return {salary:0,lp:0,ep:0};
    const hist = (salHist[eid]||[]).filter(h=>h.ym<=ym);
    if (!hist.length) return {salary:emp.salary,lp:emp.lp||0,ep:emp.ep||0};
    const h = hist[hist.length-1];
    return {salary:h.salary,lp:h.lp||0,ep:h.ep||0};
  };

  const getSum = (eid, ym) => {
    const [y,m] = ym.split('-').map(Number);
    let P=0,A=0,H=0,L=0,E=0,U=0,J=0;
    for (let d=1; d<=daysInMonth(y,m); d++) {
      const ed = att[`${ym}-${String(d).padStart(2,'0')}`]?.[eid];
      if (!ed||!ed.status) { A++; continue; }
      if (ed.status==='P') P++; else if (ed.status==='A') A++; else if (ed.status==='H') H++;
      if (ed.late) L++; if (ed.early) E++;
      if (ed.upad) { const v=parseFloat(ed.upad)||0; if(v>0) U+=v; else if(v<0) J+=Math.abs(v); }
    }
    return {P,A,H,L,E,U,J};
  };

  const getSal = (eid, ym) => {
    const emp = emps.find(e=>e.id===eid); if (!emp) return null;
    const s = getSum(eid, ym);
    const {salary,lp,ep} = getEmpData(eid, ym);
    const [y,m] = ym.split('-').map(Number);
    const wd = daysInMonth(y,m);
    const perDay = salary/wd;
    const absD = (s.A+s.H*.5)*perDay, lD=s.L*lp, eD=s.E*ep;
    const gross = salary-absD-lD-eD;
    return {...s,perDay,absD,lD,eD,gross,net:gross-s.U+s.J,basic:salary,lp,ep,wd};
  };

  const getOB = (eid, ym, depth=0) => {
    const key = `${eid}_${ym}`;
    if (ob[key] !== undefined) return ob[key]?.amount ?? ob[key]; // Firebase saved record
    if (depth >= 24) return 0;
    const prevYM = shiftMonth(ym,-1);
    const prevSal = getSal(eid, prevYM);
    if (!prevSal) return 0;
    const prevOB = getOB(eid, prevYM, depth+1);
    const toPay = Math.round(prevSal.net - prevOB);
    return toPay > 0 ? toPay : 0;
  };

    const nextYM = shiftMonth(ym, +1);
    const staffList = emps.filter(e=>!e.archived);
    const updates = {};
    const logEntries = [];
    for (const emp of staffList) {
      const key = `${emp.id}_${nextYM}`;
      const existing = ob[key];
      if (existing?.isManual) continue; // manual override — skip
      const sal = getSal(emp.id, ym);
      if (!sal) continue;
      const prevOB = getOB(emp.id, ym);
      const toPay = Math.max(0, Math.round(sal.net - prevOB));
      updates[`oldBalance/${key}`] = {amount:toPay, isManual:false, autoFrom:ym, postedAt:nowIST()};
      logEntries.push({type:'OB',empId:emp.id,empName:emp.name,ym:nextYM,detail:`Auto-post from ${ym}: ₹${toPay}`});
    }
    if (Object.keys(updates).length) {
      await db.ref().update(updates);

      showFlash(`✓ Old Balance auto-posted for ${fmtMonthLabel(nextYM)}`);

    const updated = [...base,{ym,salary,lp,ep}].sort((a,b)=>a.ym.localeCompare(b.ym));
    db.ref(`salaryHistory/${eid}`).set(updated);

                const s=getSum(e.id,ym);
                if(s.P+s.A+s.H===0)return null;
                const bg=s.A>3?'#fee2e2':s.P>20?'#dcfce7':'#f1f5f9';
                const fg=s.A>3?'#991b1b':s.P>20?'#166534':'#374151';
                return React.createElement('button',{key:e.id,
                  onClick:()=>{setHistEmp(e.id);setHistYM(ym);},
                  title:`${e.name}: P${s.P} A${s.A} H${s.H}`,
                  style:{...btn(bg,fg,'2px 8px'),fontSize:10,border:`1px solid ${bg}`}
                },e.name);
              })
            )
          );
        })
      )
    );
  }

  // ═══════════════════════════════════════════════════════════
  // RENDER: AUDIT LOG TAB
  // ═══════════════════════════════════════════════════════════
  function renderLog() {
    const TYPE_META = {
      ATT:{lbl:'Attendance',bg:'#dbeafe',fg:'#1e40af',icon:'📋'},
      UPAD:{lbl:'UPAD/Jama',bg:'#faf5ff',fg:'#5b21b6',icon:'₹'},
      OB:{lbl:'Old Balance',bg:'#ede9fe',fg:'#5b21b6',icon:'🔄'},
      SAL:{lbl:'Salary Change',bg:'#dcfce7',fg:'#14532d',icon:'💼'},
      STAFF:{lbl:'Staff Change',bg:'#fef9c3',fg:'#713f12',icon:'👤'},
    };
    const filtered = auditLog.filter(e=>{
      if(logFilter.type&&e.action!==logFilter.type)return false;
      if(logFilter.empId&&e.empId!==logFilter.empId)return false;
      if(logFilter.ym&&e.ym!==logFilter.ym&&(!e.date||!e.date.startsWith(logFilter.ym)))return false;
      return true;
    });

    return React.createElement('div',null,
      React.createElement('div',{style:{...card,padding:'12px 16px',display:'flex',gap:10,flexWrap:'wrap',alignItems:'center',marginBottom:12}},
        React.createElement('span',{style:{fontWeight:900,color:NAVY,fontSize:14}},'📝 Audit Log'),
        React.createElement('span',{style:{fontSize:12,color:'#94a3b8'}},auditLog.length+' entries'),
        React.createElement('select',{value:logFilter.type,onChange:ev=>setLogFilter({...logFilter,type:ev.target.value}),style:{...inp,padding:'5px 8px',fontSize:12}},
          React.createElement('option',{value:''},'All Types'),
          Object.entries(TYPE_META).map(([k,v])=>React.createElement('option',{key:k,value:k},v.icon+' '+v.lbl))
        ),
        React.createElement('select',{value:logFilter.empId,onChange:ev=>setLogFilter({...logFilter,empId:ev.target.value}),style:{...inp,padding:'5px 8px',fontSize:12}},
          React.createElement('option',{value:''},'All Staff'),
          emps.map(e=>React.createElement('option',{key:e.id,value:e.id},e.name))
        ),
        React.createElement('input',{type:'month',value:logFilter.ym,onChange:ev=>setLogFilter({...logFilter,ym:ev.target.value}),style:{...inp,padding:'5px 8px',fontSize:12}}),
        (logFilter.type||logFilter.empId||logFilter.ym)&&React.createElement('button',{onClick:()=>setLogFilter({type:'',empId:'',ym:''}),style:btn('#fee2e2','#dc2626','5px 12px')},'✕ Clear'),
        React.createElement('div',{style:{marginLeft:'auto',fontSize:12,color:'#94a3b8'}},filtered.length+' results')
      ),
      filtered.length===0 ?
        React.createElement('div',{style:{...card,padding:'40px',textAlign:'center',color:'#94a3b8',fontStyle:'italic'}},'No log entries found')
      :
        React.createElement('div',{style:{...card,padding:0,overflow:'hidden'}},
          React.createElement('table',{style:{width:'100%',borderCollapse:'collapse',minWidth:600}},
            React.createElement('thead',null,React.createElement('tr',{style:{background:NAVY}},
              ...['Time','Type','Staff','Device','Month','Detail'].map(h=>React.createElement('th',{key:h,style:{...thS,color:'#fff',textAlign:'left',fontSize:11}},'  '+h))
            )),
            React.createElement('tbody',null,filtered.map((entry,i)=>{
              const tm=TYPE_META[entry.action]||{lbl:entry.action,bg:'#f1f5f9',fg:'#374151',icon:'•'};
              return React.createElement('tr',{key:entry._key||i,style:{background:i%2===0?'#fff':'#f8fafc',borderBottom:'1px solid #f1f5f9'}},
                React.createElement('td',{style:{...tdS,fontSize:11,color:'#64748b',whiteSpace:'nowrap'}},fmtTs(entry.ts)),
                React.createElement('td',{style:{...tdS,whiteSpace:'nowrap'}},React.createElement('span',{style:{background:tm.bg,color:tm.fg,padding:'2px 8px',borderRadius:5,fontSize:10,fontWeight:800}},tm.icon+' '+tm.lbl)),
                React.createElement('td',{style:{...tdS,fontWeight:700,color:NAVY,fontSize:12}},entry.empName||'—'),
                React.createElement('td',{style:{...tdS,fontSize:11,color:'#94a3b8'}},entry.device||'—'),
                React.createElement('td',{style:{...tdS,fontSize:11,color:'#64748b'}},entry.ym||entry.date||'—'),
                React.createElement('td',{style:{...tdS,fontSize:12,color:'#374151',maxWidth:320}},entry.detail||`${entry.oldVal??'—'} → ${entry.newVal??'—'}`)
              );
            }))
          )
        )
    );
  }

  // ═══════════════════════════════════════════════════════════
  // MAIN RENDER
  // ═══════════════════════════════════════════════════════════
  const TABS = [
    {id:'att',lbl:'📋 Hajar'},
    {id:'emp',lbl:'👥 Staff'},
    {id:'sum',lbl:'📊 Mahino'},
    {id:'sal',lbl:'💰 Pagar Slip'},
    {id:'hist',lbl:'📅 History'},
    {id:'log',lbl:'📝 Log'}
  ];

  return React.createElement('div',{style:{minHeight:'100vh',background:'#eef2f7'}},
    settingsModal,
    salaryPinModal,
    // Header
    React.createElement('div',{style:{background:NAVY,padding:'10px 18px',display:'flex',justifyContent:'space-between',alignItems:'center',flexWrap:'wrap',gap:8}},
      React.createElement('div',null,
        React.createElement('div',{style:{color:ORANGE,fontWeight:900,fontSize:16,letterSpacing:1.2}},'EAGLE ENTERPRISE'),
        React.createElement('div',{style:{color:'#475569',fontSize:11,marginTop:1}},'Attendance V3 — Firebase')
      ),
      React.createElement('div',{style:{display:'flex',alignItems:'center',gap:8,flexWrap:'wrap'}},
        flash&&React.createElement('div',{className:'flash',style:{background:GREEN,color:'#fff',padding:'4px 12px',borderRadius:20,fontSize:12,fontWeight:700}},flash),
        React.createElement('div',{style:{display:'flex',alignItems:'center',gap:4,fontSize:11,fontWeight:700,color:fbConnected?'#86efac':'#fca5a5'}},
          React.createElement('span',{className:`fb-dot ${fbStatus}`}),
          fbConnected?'Firebase Live':'Reconnecting...'
        ),
        React.createElement('div',{style:{background:'#1e3a5f',color:'#94a3b8',fontSize:10,fontWeight:700,padding:'3px 8px',borderRadius:6}},_deviceName),
        React.createElement('div',{style:{color:'#475569',fontSize:11,fontWeight:600}},activeEmps.length+' Active'),
        React.createElement('button',{onClick:openSettings,style:{...btn('#2d4a6e','#94a3b8','5px 10px'),fontSize:11}},'⚙️ Settings'),
        React.createElement('button',{onClick:()=>{sessionStorage.removeItem(SESSION_KEY);window.location.reload();},style:{...btn('#1e3a5f','#64748b','5px 10px'),fontSize:11}},'🔒 Lock')
      )
    ),
    // Tabs
    React.createElement('div',{style:{background:'#fff',borderBottom:'2px solid #e2e8f0',display:'flex',overflowX:'auto'}},
      TABS.map(t=>React.createElement('button',{key:t.id,onClick:()=>{setTab(t.id);setHistEmp(null);setHistYM(null)},style:{padding:'13px 18px',border:'none',background:'none',cursor:'pointer',fontWeight:700,fontSize:13,color:tab===t.id?ORANGE:'#64748b',borderBottom:tab===t.id?`3px solid ${ORANGE}`:'3px solid transparent',fontFamily:'inherit',whiteSpace:'nowrap'}},t.lbl))
    ),
    // Content
    React.createElement('div',{style:{padding:14,maxWidth:1200,margin:'0 auto'}},
      tab==='att'&&renderAtt(),
      tab==='emp'&&renderEmp(),
      tab==='sum'&&renderSum(),
      tab==='sal'&&renderSal(),
      tab==='hist'&&renderHistory(),
      tab==='log'&&renderLog()
    )
  );
}

ReactDOM.render(React.createElement(App), document.getElementById('root'));
</script>
</body>
</html>
