// ── Google Sheets sync layer ────────────────────────────────
let _gsUrl=localStorage.getItem(GS_URL_LS)||'';
const setGsUrl=(url)=>{_gsUrl=url;localStorage.setItem(GS_URL_LS,url)};

const gsWrite=async(k,val)=>{
  if(!_gsUrl)return;
  try{
    fetch(_gsUrl,{
      method:'POST',mode:'no-cors',
      headers:{'Content-Type':'text/plain'},
      body:JSON.stringify({action:'set',key:k,value:val})
    });
  }catch{}
};
const gsRead=async(k)=>{
  if(!_gsUrl)return null;
  try{
    const r=await fetch(`${_gsUrl}?action=get&key=${encodeURIComponent(k)}`);
    const d=await r.json();
    return d.value||null;
  }catch{return null}
};
const gsReadAll=async()=>{
  if(!_gsUrl)return null;
  try{
    const r=await fetch(`${_gsUrl}?action=all`);
    return await r.json();
  }catch{return null}
};

// ── Primary storage (window.storage) + background GS sync ──
const stSave=async(k,d)=>{
  const str=JSON.stringify(d);
  try{await window.storage.set(k,str)}catch{}
  gsWrite(k,str); // background sync — no await
};
const stLoad=async(k,fb)=>{
  // Try local first (fast)
  try{const r=await window.storage.get(k);if(r)return JSON.parse(r.value)}catch{}
  // Fallback: Google Sheets (if local cleared)
  const gsVal=await gsRead(k);
  if(gsVal){
    try{await window.storage.set(k,gsVal)}catch{}
    return JSON.parse(gsVal);
  }
  return fb;
};

  const getOb=(eid,ym,depth=0)=>{

  const exportMahinoExcel=(ym)=>{
    const[y,m]=ym.split('-').map(Number);
    const monthLabel=new Date(y,m-1,1).toLocaleDateString('en-IN',{month:'long',year:'numeric'});
    const wd=daysInMonth(y,m);
    // Header row
    const headers=['#','Employee','Basic Salary','Per Day','Present','Absent','Half Day','Late','Early Going','UPAD (Deducted)','Jama (Credit)','Gross Salary','Est. Net Salary','Old Balance','To Pay'];
    const rows=activeEmps.map((e,i)=>{

      if(!sal)return null;

      const toPay=Math.round(sal.net-oldBal);
      return[

            React.createElement('div',{style:{background:'#e0f2fe',color:'#0369a1',padding:'6px 14px',borderRadius:8,fontWeight:800,fontSize:14}},`To Pay: ₹${Math.round(totalToPay).toLocaleString()}`)
          )
        ),
        React.createElement('div',{style:{...card,padding:0,overflowX:'auto'}},
          React.createElement('table',{style:{width:'100%',borderCollapse:'collapse',minWidth:720}},
            React.createElement('thead',null,React.createElement('tr',{style:{background:NAVY}},
              ...['Employee','Basic','P','A','H','Late','Early','UPAD','Jama','Est. Net','Old Bal','To Pay',''].map(h=>React.createElement('th',{key:h,style:{...thS,color:'#fff',textAlign:h==='Employee'||h==='Basic'?'left':'center'}},h))
            )),
            React.createElement('tbody',null,rows.map(({e,s,net,oldBal,toPay},i)=>
              React.createElement('tr',{key:e.id,style:{background:i%2===0?'#fff':'#f8fafc',opacity:e.archived?.8:1}},
                React.createElement('td',{style:{...tdS,fontWeight:900,color:e.archived?'#94a3b8':NAVY}},
                  e.name,
                  e.archived&&React.createElement('span',{style:{marginLeft:5,fontSize:9,background:'#e2e8f0',color:'#64748b',padding:'1px 5px',borderRadius:3,fontWeight:700,verticalAlign:'middle'}},'ARCHIVED')
                ),
                React.createElement('td',{style:{...tdS,color:e.archived?'#94a3b8':'#374151'}},`₹${e.salary.toLocaleString()}`),
                React.createElement('td',{style:{...tdS,textAlign:'center'}},pill(s.P,'#dcfce7','#166534')),
                React.createElement('td',{style:{...tdS,textAlign:'center'}},pill(s.A,'#fee2e2','#991b1b')),
                React.createElement('td',{style:{...tdS,textAlign:'center'}},pill(s.H,'#fef3c7','#92400e')),
                React.createElement('td',{style:{...tdS,textAlign:'center',color:s.L>0?RED:'#cbd5e1',fontWeight:s.L>0?700:400}},s.L||'—'),
                React.createElement('td',{style:{...tdS,textAlign:'center',color:s.E>0?AMBER:'#cbd5e1',fontWeight:s.E>0?700:400}},s.E||'—'),
                React.createElement('td',{style:{...tdS,textAlign:'center',color:s.U>0?'#7c3aed':'#cbd5e1',fontWeight:s.U>0?700:400}},s.U>0?`–₹${s.U.toLocaleString()}`:'—'),
                React.createElement('td',{style:{...tdS,textAlign:'center',color:s.J>0?GREEN:'#cbd5e1',fontWeight:s.J>0?700:400}},s.J>0?`+₹${s.J.toLocaleString()}`:'—'),
                React.createElement('td',{style:{...tdS,textAlign:'center',fontWeight:900,fontSize:15,color:net>=0?'#166534':'#dc2626'}},`₹${Math.round(net).toLocaleString()}`),
                React.createElement('td',{style:{...tdS,textAlign:'center',color:oldBal>0?'#7c3aed':'#cbd5e1',fontWeight:oldBal>0?700:400}},oldBal>0?`₹${oldBal.toLocaleString()}`:'—'),
                React.createElement('td',{style:{...tdS,textAlign:'center',fontWeight:900,fontSize:15,color:toPay>=0?'#0369a1':'#dc2626',background:toPay>=0?'#e0f2fe':'#fee2e2',borderRadius:6}},`₹${Math.round(toPay).toLocaleString()}`),
                React.createElement('td',{style:tdS},
                  React.createElement('button',{onClick:()=>{setSalEmp(e.id);setSalYM(histYM);setTab('sal')},style:btn('#f0fdf4','#166534','4px 10px')},'Slip →')
                )
              )
            ))
          )
        )
      );
    }

    // Overview: all months as cards
    return React.createElement('div',null,
      React.createElement('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:12}},
        React.createElement('div',{style:{fontWeight:900,color:NAVY,fontSize:15}},`${allMonths.length} months with data`),
        React.createElement('div',{style:{fontSize:12,color:'#94a3b8'}})
      ),
      // Staff history row
      React.createElement('div',{style:{...card,padding:'14px 18px',marginBottom:14}},
        React.createElement('div',{style:{fontWeight:700,color:'#64748b',fontSize:12,marginBottom:10,letterSpacing:.5}},'EMPLOYEE WISE HISTORY →'),
        React.createElement('div',{style:{display:'flex',flexWrap:'wrap',gap:8,marginBottom:archivedEmps.length>0?10:0}},
          activeEmps.map(e=>React.createElement('button',{key:e.id,onClick:()=>setHistEmp(e.id),style:{
            padding:'6px 14px',borderRadius:20,border:`1px solid #e2e8f0`,background:'#f8fafc',
            cursor:'pointer',fontWeight:700,fontSize:13,color:NAVY,fontFamily:'inherit',
          }},e.name))
        ),
        archivedEmps.length>0&&React.createElement('div',null,
          React.createElement('div',{style:{fontSize:11,color:'#94a3b8',fontWeight:700,marginBottom:6,marginTop:4}},'📦 ARCHIVED STAFF'),
          React.createElement('div',{style:{display:'flex',flexWrap:'wrap',gap:8}},
            archivedEmps.map(e=>React.createElement('button',{key:e.id,onClick:()=>setHistEmp(e.id),style:{
              padding:'6px 14px',borderRadius:20,border:`1px dashed #cbd5e1`,background:'#f1f5f9',
              cursor:'pointer',fontWeight:700,fontSize:13,color:'#94a3b8',fontFamily:'inherit',
            }},`📦 ${e.name}`))
          )
        )
      ),
      // Month cards grid
      React.createElement('div',{style:{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(260px,1fr))',gap:10}},
        allMonths.map(ym=>{
          const[y,m]=ym.split('-').map(Number);
          const days=daysInMonth(y,m);
          // Quick stats across all employees
          let totalP=0,totalA=0,totalH=0,totalUpad=0,markedDays=new Set();
          emps.forEach(e=>{
            for(let d=1;d<=days;d++){
              const ds=`${ym}-${String(d).padStart(2,'0')}`;
              const ed=att[ds]?.[e.id];
              if(ed&&ed.status){
                markedDays.add(ds);
                if(ed.status==='P')totalP++;
                else if(ed.status==='A')totalA++;
                else if(ed.status==='H')totalH++;
                if(ed.upad)totalUpad+=parseFloat(ed.upad)||0;
              }
            }
          });
          const isThisMonth=ym===todayStr().slice(0,7);
          return React.createElement('div',{key:ym,onClick:()=>setHistYM(ym),style:{
            ...card,padding:'16px 18px',cursor:'pointer',transition:'box-shadow .15s, transform .15s',
            border:isThisMonth?`2px solid ${ORANGE}`:'2px solid transparent',
          },
          onMouseEnter:e=>{e.currentTarget.style.boxShadow='0 4px 16px rgba(0,0,0,.14)';e.currentTarget.style.transform='translateY(-2px)'},
          onMouseLeave:e=>{e.currentTarget.style.boxShadow='0 1px 5px rgba(0,0,0,.09)';e.currentTarget.style.transform='translateY(0)'}},
            React.createElement('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:10}},
              React.createElement('div',null,
                React.createElement('div',{style:{fontWeight:900,fontSize:15,color:NAVY}},fmtMonthLabel(ym)),
                React.createElement('div',{style:{fontSize:11,color:'#94a3b8',marginTop:1}},`${markedDays.size} days recorded`)
              ),
              isThisMonth&&React.createElement('span',{style:{background:ORANGE,color:'#fff',fontSize:10,fontWeight:800,padding:'2px 8px',borderRadius:20}},'THIS MONTH')
            ),
            React.createElement('div',{style:{display:'flex',gap:8,marginBottom:8}},
              React.createElement('div',{style:{flex:1,textAlign:'center',background:'#dcfce7',borderRadius:8,padding:'6px 4px'}},
                React.createElement('div',{style:{fontWeight:900,fontSize:18,color:'#166534'}},totalP),
                React.createElement('div',{style:{fontSize:10,color:'#4ade80',fontWeight:700}},'P')
              ),
              React.createElement('div',{style:{flex:1,textAlign:'center',background:'#fee2e2',borderRadius:8,padding:'6px 4px'}},
                React.createElement('div',{style:{fontWeight:900,fontSize:18,color:'#dc2626'}},totalA),
                React.createElement('div',{style:{fontSize:10,color:'#f87171',fontWeight:700}},'A')
              ),
              React.createElement('div',{style:{flex:1,textAlign:'center',background:'#fef3c7',borderRadius:8,padding:'6px 4px'}},
                React.createElement('div',{style:{fontWeight:900,fontSize:18,color:'#92400e'}},totalH),
                React.createElement('div',{style:{fontSize:10,color:'#fbbf24',fontWeight:700}},'H')
              ),
              totalUpad>0&&React.createElement('div',{style:{flex:1,textAlign:'center',background:'#f5f3ff',borderRadius:8,padding:'6px 4px'}},
                React.createElement('div',{style:{fontWeight:900,fontSize:13,color:'#7c3aed'}},`₹${(totalUpad/1000).toFixed(0)}k`),
                React.createElement('div',{style:{fontSize:10,color:'#a78bfa',fontWeight:700}},'UPAD')
              )
            ),
            React.createElement('div',{style:{fontSize:12,color:'#94a3b8',textAlign:'right',marginTop:4}},
              'Click for details →'
            )
          );
        })
      )
    );
  }

  // ── Audit Log ──────────────────────────────────────────────
  function renderLog(){
    const TYPE_META={
      ATT:{lbl:'Attendance',bg:'#dbeafe',fg:'#1e40af',icon:'📋'},
      UPAD:{lbl:'UPAD / Jama',bg:'#f3e8ff',fg:'#6b21a8',icon:'💰'},
      OB:{lbl:'Old Balance',bg:'#ede9fe',fg:'#5b21b6',icon:'🔄'},
      SAL:{lbl:'Salary Change',bg:'#dcfce7',fg:'#14532d',icon:'💼'},
      STAFF:{lbl:'Staff Change',bg:'#fef9c3',fg:'#713f12',icon:'👤'},
    };
    // Filter
    const filtered=auditLog.filter(e=>{
      if(logFilter.type&&e.type!==logFilter.type)return false;
      if(logFilter.empId&&e.empId!==logFilter.empId)return false;
      if(logFilter.ym&&e.ym!==logFilter.ym&&(!e.date||!e.date.startsWith(logFilter.ym)))return false;
      return true;
    });
    const fmtTs=(ts)=>{
      const d=new Date(ts);
      return d.toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'2-digit'})+' '+d.toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit',hour12:true});
    };
    return React.createElement('div',null,
      // Filter bar
      React.createElement('div',{style:{...card,padding:'12px 16px',display:'flex',gap:10,flexWrap:'wrap',alignItems:'center',marginBottom:12}},
        React.createElement('span',{style:{fontWeight:900,color:NAVY,fontSize:14}},'📝 Audit Log'),
        React.createElement('span',{style:{fontSize:12,color:'#94a3b8',fontWeight:600}},`${auditLog.length} total entries`),
        React.createElement('select',{value:logFilter.type,onChange:ev=>setLogFilter({...logFilter,type:ev.target.value}),style:{...inp,padding:'5px 8px',fontSize:12}},
          React.createElement('option',{value:''},'All Types'),
          Object.entries(TYPE_META).map(([k,v])=>React.createElement('option',{key:k,value:k},v.icon+' '+v.lbl))
        ),
        React.createElement('select',{value:logFilter.empId,onChange:ev=>setLogFilter({...logFilter,empId:ev.target.value}),style:{...inp,padding:'5px 8px',fontSize:12}},
          React.createElement('option',{value:''},'All Staff'),
          emps.map(e=>React.createElement('option',{key:e.id,value:e.id},e.name))
        ),
        React.createElement('input',{type:'month',value:logFilter.ym,onChange:ev=>setLogFilter({...logFilter,ym:ev.target.value}),style:{...inp,padding:'5px 8px',fontSize:12}}),
        (logFilter.type||logFilter.empId||logFilter.ym)&&React.createElement('button',{onClick:()=>setLogFilter({type:'',empId:'',ym:''}),style:btn('#fee2e2','#dc2626','5px 12px')},'✕ Clear'),
        React.createElement('div',{style:{marginLeft:'auto',fontSize:12,color:'#94a3b8'}},`${filtered.length} results`),
        auditLog.length>0&&React.createElement('button',{onClick:()=>{if(window.confirm('Full log delete karvu? This cannot be undone.')){setAuditLog([]);stSave(K_LOG,[]);showFlash('✓ Log cleared');}},style:btn('#f1f5f9','#94a3b8','5px 10px')}, '🗑 Clear Log')
      ),
      filtered.length===0?
        React.createElement('div',{style:{...card,padding:'40px',textAlign:'center',color:'#94a3b8',fontStyle:'italic'}},'No log entries found')
      :
      React.createElement('div',{style:{...card,padding:0,overflow:'hidden'}},
        React.createElement('table',{style:{width:'100%',borderCollapse:'collapse',minWidth:600}},
          React.createElement('thead',null,React.createElement('tr',{style:{background:NAVY}},
            ...['Time','Type','Staff','Date / Month','Change Detail'].map(h=>React.createElement('th',{key:h,style:{...thS,color:'#fff',textAlign:'left',fontSize:11}},'  '+h))
          )),
          React.createElement('tbody',null,filtered.map((entry,i)=>{
            const tm=TYPE_META[entry.type]||{lbl:entry.type,bg:'#f1f5f9',fg:'#374151',icon:'•'};
            return React.createElement('tr',{key:i,style:{background:i%2===0?'#fff':'#f8fafc',borderBottom:'1px solid #f1f5f9'}},
              React.createElement('td',{style:{...tdS,fontSize:11,color:'#64748b',whiteSpace:'nowrap'}},fmtTs(entry.ts)),
              React.createElement('td',{style:{...tdS,whiteSpace:'nowrap'}},
                React.createElement('span',{style:{background:tm.bg,color:tm.fg,padding:'2px 8px',borderRadius:5,fontSize:10,fontWeight:800}},tm.icon+' '+tm.lbl)
              ),
              React.createElement('td',{style:{...tdS,fontWeight:700,color:NAVY,fontSize:12}},entry.empName||'—'),
              React.createElement('td',{style:{...tdS,fontSize:11,color:'#64748b'}},entry.date||entry.ym||'—'),
              React.createElement('td',{style:{...tdS,fontSize:12,color:'#374151',maxWidth:320}},entry.detail||'—')
            );
          }))
        )
      )
    );
  }

  const TABS=[{id:'att',lbl:'📋 Hajar'},{id:'emp',lbl:'👥 Staff'},{id:'sum',lbl:'📊 Mahino'},{id:'sal',lbl:'💰 Pagar Slip'},{id:'hist',lbl:'📅 History'},{id:'log',lbl:'📝 Log'}];

  return React.createElement('div',{style:{minHeight:'100vh',background:'#eef2f7'}},
    settingsModal,
    salaryPinModal,
    React.createElement('div',{style:{background:NAVY,padding:'10px 18px',display:'flex',justifyContent:'space-between',alignItems:'center',flexWrap:'wrap',gap:8}},
      React.createElement('div',null,
        React.createElement('div',{style:{color:ORANGE,fontWeight:900,fontSize:16,letterSpacing:1.2}},'EAGLE ENTERPRISE'),
        React.createElement('div',{style:{color:'#475569',fontSize:11,marginTop:1}},'Staff Attendance System')
      ),
      React.createElement('div',{style:{display:'flex',alignItems:'center',gap:8,flexWrap:'wrap'}},
        flash&&React.createElement('div',{className:'flash',style:{background:GREEN,color:'#fff',padding:'4px 12px',borderRadius:20,fontSize:12,fontWeight:700}},flash),
        syncStatus==='syncing'&&React.createElement('div',{style:{color:'#93c5fd',fontSize:11,fontWeight:600}},'⟳ Syncing...'),
        syncStatus==='ok'&&React.createElement('div',{style:{color:'#86efac',fontSize:11,fontWeight:600}},'✓ Synced'),
        syncStatus==='err'&&React.createElement('div',{style:{color:'#fca5a5',fontSize:11,fontWeight:600}},'⚠ Sync error'),
        _gsUrl?React.createElement('div',{style:{background:'#166534',color:'#86efac',fontSize:10,fontWeight:700,padding:'3px 8px',borderRadius:6}},
          '☁ GSheets ON'
        ):React.createElement('div',{style:{background:'#7f1d1d',color:'#fca5a5',fontSize:10,fontWeight:700,padding:'3px 8px',borderRadius:6,cursor:'pointer'},onClick:openSettings},
          '☁ Setup Cloud'
        ),
        React.createElement('div',{style:{color:'#475569',fontSize:11,fontWeight:600}},`${activeEmps.length} Active`),
        React.createElement('button',{onClick:openSettings,style:{...btn('#2d4a6e','#94a3b8','5px 10px'),fontSize:11}},'⚙️ Settings'),
        React.createElement('button',{onClick:()=>{sessionStorage.removeItem('eagle_authed');window.location.reload();},style:{...btn('#1e3a5f','#64748b','5px 10px'),fontSize:11}},'🔒 Lock')
      )
    ),
    React.createElement('div',{style:{background:'#fff',borderBottom:'2px solid #e2e8f0',display:'flex',overflowX:'auto'}},
      TABS.map(t=>React.createElement('button',{key:t.id,onClick:()=>{setTab(t.id);setHistYM(null);setHistEmp(null)},style:{
        padding:'13px 18px',border:'none',background:'none',cursor:'pointer',fontWeight:700,fontSize:13,
        color:tab===t.id?ORANGE:'#64748b',
        borderBottom:tab===t.id?`3px solid ${ORANGE}`:'3px solid transparent',
        fontFamily:'inherit',whiteSpace:'nowrap',
      }},t.lbl))
    ),
    React.createElement('div',{style:{padding:14,maxWidth:1200,margin:'0 auto'}},
      tab==='att'&&renderAtt(),
      tab==='emp'&&renderEmp(),
      tab==='sum'&&renderSum(),
      tab==='sal'&&renderSal(),
      tab==='hist'&&renderHistory(),
      tab==='log'&&renderLog()
    )
  );
}

ReactDOM.render(React.createElement(App),document.getElementById('root'));
</script>
</body>
</html>
